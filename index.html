<style>

<script>
(function () {
  "use strict";

  // Eigener Cloudflare-Worker-Proxy (leitet Anfragen an bahn.de weiter)
  const PROXY_BASE = "https://db-proxy.daniel-goergen.workers.dev";

  const WINDOW_MIN = 120;      // Zeitfenster in Minuten
  const PAST_MIN = 30;         // wie weit zurück (bereits abgefahrene Züge, die noch unterwegs sind)

  // Referenzkoordinaten zum eindeutigen Auflösen der Stationen
  // (verhindert Verwechslung z.B. mit "Dillingen (Donau)")
  const STATIONS = {
    sb: { key: "sb", label: "Saarbrücken Hbf",  query: "Saarbrücken Hbf",   lat: 49.2414,  lon: 6.9906,  id: null, bahnde: null },
    dl: { key: "dl", label: "Dillingen (Saar)",  query: "Dillingen (Saar)", lat: 49.35263, lon: 6.72258, id: null, bahnde: null }
  };

  let direction = localStorage.getItem("direction") || "sb-dl"; // "sb-dl" oder "dl-sb"
  let autoMode = true;

  const el = {
    fromName: document.getElementById("fromName"),
    toName: document.getElementById("toName"),
    statusText: document.getElementById("statusText"),
    list: document.getElementById("list"),
    swapBtn: document.getElementById("swapBtn"),
    locateBtn: document.getElementById("locateBtn"),
    autoBadge: document.getElementById("autoBadge"),
    autoBadgeText: document.getElementById("autoBadgeText"),
    clock: document.getElementById("clock")
  };

  // ---------- Hilfsfunktionen ----------

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  }

  function updateClock() {
    el.clock.textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- Netzwerk ----------

  async function fetchOnce(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal, mode: "cors", cache: "no-store" });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.text()).slice(0, 200); } catch (e) {}
        throw new Error("Proxy-Fehler " + res.status + (detail ? " – " + detail : ""));
      }
      return await res.json();
    } catch (err) {
      if (err.name === "AbortError") throw new Error("Zeitüberschreitung – keine Antwort vom Proxy.");
      if (err instanceof TypeError) throw new Error("Keine Verbindung zum Proxy.");
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  // ---------- Hilfsfunktionen für bahn.de ----------

  function pad2(n) { return String(n).padStart(2, "0"); }
  function localDatum(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function localZeit(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }

  // ---------- bahn.de über eigenen Proxy (primäre Quelle, falls konfiguriert) ----------

  async function resolveStationBahnDe(proxyBase, station) {
    const cacheKey = "bahndeId:" + station.key;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      station.bahnde = JSON.parse(cached);
      return;
    }
    const path = `/web/api/reiseloesung/orte?suchbegriff=${encodeURIComponent(station.query)}&typ=ALL&limit=6`;
    const data = await fetchOnce(proxyBase + path, 8000);
    const arr = Array.isArray(data) ? data : (data.orte || data.results || Object.values(data).find(v => Array.isArray(v)) || []);
    if (!arr || !arr.length) throw new Error("bahn.de (Proxy): Station nicht gefunden – " + station.label);

    let best = null, bestDist = Infinity;
    for (const s of arr) {
      const lat = s.lat ?? s.latitude ?? (s.coordinates && s.coordinates.lat);
      const lon = s.lon ?? s.lng ?? s.longitude ?? (s.coordinates && s.coordinates.lng);
      if (lat == null || lon == null) continue;
      const d = haversine(station.lat, station.lon, lat, lon);
      if (d < bestDist) { bestDist = d; best = s; }
    }
    if (!best) best = arr[0];

    const extId = best.extId || best.evaNr || best.ortExtId;
    const ortId = best.id || best.ortId;
    if (!extId || !ortId) {
      throw new Error("bahn.de (Proxy): Unerwartetes Antwortformat bei der Stationssuche.\n" + JSON.stringify(best).slice(0, 300));
    }
    station.bahnde = { extId: String(extId), ortId: String(ortId), name: best.name || station.label };
    localStorage.setItem(cacheKey, JSON.stringify(station.bahnde));
  }

  async function fetchBoardBatch(proxyBase, board, station, when, maxVias) {
    const path = `/web/api/reiseloesung/${board}?datum=${localDatum(when)}&zeit=${encodeURIComponent(localZeit(when))}` +
      `&ortExtId=${encodeURIComponent(station.bahnde.extId)}&ortId=${encodeURIComponent(station.bahnde.ortId)}` +
      `&mitVias=true&maxVias=${maxVias}`;
    const data = await fetchOnce(proxyBase + path, 8000);
    const arr = Array.isArray(data) ? data : (data.entries || data.abfahrten || data.ankuenfte || Object.values(data).find(v => Array.isArray(v)) || null);
    if (!Array.isArray(arr)) {
      throw new Error("Unerwartetes Antwortformat (" + board + ").\n" + JSON.stringify(data).slice(0, 300));
    }
    return arr;
  }

  function median(values) {
    const a = values.slice().sort((x, y) => x - y);
    const m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  // Zeitpunkte (ms), ab denen noch nicht abgedeckt ist, was bis endMs gebraucht wird.
  function findGaps(covered, startMs, endMs) {
    const sorted = covered.slice().sort((a, b) => a[0] - b[0]);
    const gaps = [];
    let cur = startMs;
    for (const [s, e] of sorted) {
      if (s > cur + 60000) gaps.push(cur);
      if (e > cur) cur = e;
    }
    if (cur < endMs - 60000) gaps.push(cur);
    return gaps;
  }

  // Der Endpunkt liefert pro Aufruf nur eine begrenzte Anzahl an Einträgen über ALLE
  // Richtungen. Damit das Zeitfenster schnell abgedeckt ist, werden mehrere Startzeiten
  // GLEICHZEITIG abgefragt (statt nacheinander). Bei dichtem Takt entstehende Lücken werden
  // in weiteren Runden geschlossen. Die typische Zeitspanne eines Aufrufs wird gemerkt,
  // damit beim nächsten Mal nur so viele Abrufe wie nötig gemacht werden.
  async function collectBoard(proxyBase, board, station, start, end, opts) {
    const spanKey = "span:" + board + ":" + station.key;
    const saved = parseFloat(localStorage.getItem(spanKey));
    const stepMin = saved > 0 ? Math.min(45, Math.max(10, Math.round(saved * 0.8))) : opts.defStepMin;

    const seen = new Map();
    const covered = [];
    const spans = [];
    let firstError = null, okCount = 0;
    const startMs = start.getTime(), endMs = end.getTime();

    async function probe(whenMs) {
      try {
        const batch = await fetchBoardBatch(proxyBase, board, station, new Date(whenMs), opts.maxVias);
        okCount++;
        let last = 0;
        for (const item of batch) {
          const key = item.journeyId || ((item.zeit || "") + "|" + (item.verkehrmittel && item.verkehrmittel.name));
          if (!seen.has(key)) seen.set(key, item);
          // geplante Zeit (konservativ): stimmt bei Sortierung nach Plan- UND nach Echtzeit
          const t = new Date(item.zeit || item.ezZeit).getTime();
          if (!isNaN(t) && t > last) last = t;
        }
        if (!batch.length) {
          covered.push([whenMs, endMs]);                 // nichts mehr da: bis zum Ende abgedeckt
        } else {
          const to = Math.max(last, whenMs + 60000);     // mindestens 1 Minute Fortschritt
          covered.push([whenMs, to]);
          spans.push((to - whenMs) / 60000);
        }
      } catch (err) {
        if (!firstError) firstError = err;
      }
    }

    const starts = [];
    for (let t = startMs; t < endMs; t += stepMin * 60000) starts.push(t);
    await Promise.all(starts.map(probe));
    if (okCount === 0) throw firstError || new Error("Keine Daten erhalten.");

    for (let round = 0; round < 3; round++) {
      const gaps = findGaps(covered, startMs, endMs);
      if (!gaps.length) break;
      await Promise.all(gaps.map(probe));
    }

    if (spans.length) localStorage.setItem(spanKey, String(median(spans)));
    return seen;
  }

  function trainKey(item) {
    const vm = item.verkehrmittel || item.verkehrsmittel || {};
    return (vm.name || "") + "|" + (vm.linienNummer || "");
  }

  async function fetchJourneysViaProxy(proxyBase, fromStation, toStation, onPartial, timing) {
    const T0 = performance.now();
    await Promise.all([
      resolveStationBahnDe(proxyBase, fromStation),
      resolveStationBahnDe(proxyBase, toStation)
    ]);

    const now = new Date();
    const windowEnd = new Date(now.getTime() + WINDOW_MIN * 60000);
    const windowStart = new Date(now.getTime() - PAST_MIN * 60000);

    // Abfahrten am Start und Ankünfte am Ziel parallel holen. Die Liste wird angezeigt,
    // sobald die Abfahrten da sind; die Ankunftszeiten kommen danach dazu.
    // Ein Fehler bei den Ankünften darf die Liste nicht verhindern.
    const depPromise = collectBoard(proxyBase, "abfahrten", fromStation, windowStart, windowEnd, { maxVias: 20, defStepMin: 20 })
      .then(m => { timing.dep = performance.now() - T0; return m; });
    const arrPromise = collectBoard(proxyBase, "ankuenfte", toStation,
                   new Date(windowStart.getTime() + 12 * 60000),
                   new Date(windowEnd.getTime() + 60 * 60000), { maxVias: 3, defStepMin: 30 })
      .then(m => { timing.arr = performance.now() - T0; return m; })
      .catch(err => { console.warn("Ankunftstafel nicht verfügbar:", err); timing.arr = null; return new Map(); });

    const seen = await depPromise;

    const targetNames = [
      toStation.bahnde.name,
      toStation.label,
      toStation.label.replace(" (", "("),
      toStation.label.replace(" (Saar)", "")
    ].filter(Boolean);

    // Baut die Liste; ohne Ankünfte (arrivals = null) zunächst ohne Ankunftszeit.
    function build(arrivals) {
      const arrivalsByTrain = new Map();
      if (arrivals) {
        for (const a of arrivals.values()) {
          const k = trainKey(a);
          if (!arrivalsByTrain.has(k)) arrivalsByTrain.set(k, []);
          arrivalsByTrain.get(k).push(a);
        }
      }

      // Passende Ankunft zu einer Abfahrt: gleiche Zugnummer, planmäßige Ankunft
      // nach der planmäßigen Abfahrt (frühester Treffer).
      function findArrival(depItem, plannedDeparture) {
        const list = arrivalsByTrain.get(trainKey(depItem));
        if (!list) return null;
        let best = null, bestT = Infinity;
        for (const a of list) {
          const planned = new Date(a.zeit);
          if (isNaN(planned.getTime())) continue;
          const diff = planned - plannedDeparture;
          if (diff >= -60000 && diff < 6 * 3600000 && diff < bestT) { bestT = diff; best = a; }
        }
        if (!best) return null;
        const plannedArr = new Date(best.zeit);
        const realArr = new Date(best.ezZeit || best.zeit);
        return {
          arrival: isNaN(realArr.getTime()) ? plannedArr : realArr,
          arrivalDelaySec: isNaN(realArr.getTime()) ? null : Math.round((realArr - plannedArr) / 1000)
        };
      }

      const mapped = Array.from(seen.values())
        .map(item => {
          const raw = JSON.stringify(item);
          if (!targetNames.some(n => raw.includes(n))) return null;

          const plannedRaw = item.zeit || item.plannedWhen || item.abfahrtszeit || item.planned;
          const realRaw = item.ezZeit || item.ezAbfahrtszeit || item.realZeit || item.when || plannedRaw;
          if (!plannedRaw) return null;
          const plannedDeparture = new Date(plannedRaw);
          const departure = new Date(realRaw || plannedRaw);
          if (isNaN(departure.getTime())) return null;

          let delaySec = null;
          if (typeof item.verspaetung === "number") {
            delaySec = item.verspaetung * 60;
          } else if (!isNaN(plannedDeparture.getTime()) && !isNaN(departure.getTime())) {
            delaySec = Math.round((departure - plannedDeparture) / 1000);
          }

          const vm = item.verkehrmittel || item.verkehrsmittel || {};
          const lineName = vm.mittelText || vm.linienNummer || vm.langText || vm.kurzText || item.linienbezeichnung || item.zugnummer || "?";
          const platform = item.gleis || item.ezGleis || item.plattform || item.ezPlattform || null;
          const cancelled = !!(item.cancelled || item.ausfall || item.canceled || item.storniert);
          const arr = findArrival(item, isNaN(plannedDeparture.getTime()) ? departure : plannedDeparture);

          return {
            departure,
            plannedDeparture: isNaN(plannedDeparture.getTime()) ? departure : plannedDeparture,
            departureDelay: delaySec,
            platform,
            cancelled,
            lineName,
            arrival: arr ? arr.arrival : null,
            arrivalDelaySec: arr ? arr.arrivalDelaySec : null,
            transfers: 0
          };
        })
        .filter(Boolean);

      return mapped
        .filter(j => j.departure >= windowStart && j.departure <= windowEnd)
        // bereits abgefahrene Züge nur, solange sie noch nicht am Ziel angekommen sind
        .filter(j => !(j.arrival && j.arrival < new Date(now.getTime() - 60000)))
        .sort((a, b) => a.departure - b.departure);
    }

    if (onPartial) onPartial(build(null));
    return build(await arrPromise);
  }

  // ---------- Daten je Richtung (mit kurzem Zwischenspeicher) ----------

  const FRESH_MS = 60000;   // so lange gelten geladene Daten für einen sofortigen Richtungswechsel
  const dirData = {};       // Richtung -> { journeys, at, timing }
  const dirPending = {};    // Richtung -> { promise, listeners }

  function pairFor(dir) {
    return dir === "sb-dl"
      ? { from: STATIONS.sb, to: STATIONS.dl }
      : { from: STATIONS.dl, to: STATIONS.sb };
  }

  function isFresh(dir) {
    const d = dirData[dir];
    return !!d && Date.now() - d.at < FRESH_MS;
  }

  // Liefert die Daten einer Richtung: aus dem Zwischenspeicher, von einem bereits laufenden
  // Abruf oder per neuem Abruf. onPartial bekommt vorab die Liste ohne Ankunftszeiten.
  function fetchDir(dir, force, onPartial) {
    if (!force && isFresh(dir)) return Promise.resolve(dirData[dir]);
    let entry = dirPending[dir];
    if (entry) {
      if (onPartial) entry.listeners.push(onPartial);
      return entry.promise;
    }
    entry = { listeners: onPartial ? [onPartial] : [] };
    const { from, to } = pairFor(dir);
    const timing = {};
    entry.promise = fetchJourneysViaProxy(PROXY_BASE, from, to, j => entry.listeners.forEach(fn => fn(j)), timing)
      .then(journeys => { const d = { journeys, at: Date.now(), timing }; dirData[dir] = d; return d; })
      .finally(() => { if (dirPending[dir] === entry) delete dirPending[dir]; });
    dirPending[dir] = entry;
    return entry.promise;
  }

  // ---------- Rendering ----------

  function renderLoading() {
    el.list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  }

  function renderError(msg, retryFn) {
    el.list.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "error";
    const msgEl = document.createElement("div");
    msgEl.style.whiteSpace = "pre-line";
    msgEl.style.textAlign = "left";
    msgEl.textContent = msg;
    wrap.appendChild(msgEl);
    const btn = document.createElement("button");
    btn.textContent = "Erneut versuchen";
    btn.style.marginTop = "12px";
    btn.onclick = retryFn;
    wrap.appendChild(btn);
    el.list.appendChild(wrap);
  }

  function renderJourneys(journeys, arrivalsPending) {
    el.list.innerHTML = "";
    if (!journeys.length) {
      el.list.innerHTML = `<div class="empty">Keine Verbindungen.</div>`;
      return;
    }
    for (const j of journeys) {
      const row = document.createElement("div");
      row.className = "row" + (j.departure < new Date() ? " past" : "");

      const delayMin = typeof j.departureDelay === "number" ? Math.round(j.departureDelay / 60) : null;
      const showPlanned = delayMin && delayMin !== 0;

      let delayHtml;
      if (j.cancelled) {
        delayHtml = `<span class="delay cancelled">Ausfall</span>`;
      } else if (delayMin === null) {
        delayHtml = `<span class="delay on-time">planm.</span>`;
      } else if (delayMin <= 0) {
        delayHtml = `<span class="delay on-time">pünktlich</span>`;
      } else {
        delayHtml = `<span class="delay late">+${delayMin} min</span>`;
      }

      const arrLate = typeof j.arrivalDelaySec === "number" && j.arrivalDelaySec >= 60;
      const subText = (j.arrival ? "an " + fmtTime(j.arrival) : (arrivalsPending ? "an …" : "")) +
        (j.transfers > 0 ? (j.arrival ? " · " : "") + j.transfers + "x umsteigen" : "");

      row.innerHTML = `
        <div class="row-time">
          ${fmtTime(j.departure)}
          ${showPlanned ? `<span class="planned">${fmtTime(j.plannedDeparture)}</span>` : ""}
        </div>
        <div class="row-mid">
          <div class="row-line">${j.lineName}</div>
          ${subText ? `<div class="row-sub${arrLate ? " late" : ""}">${subText}</div>` : ""}
        </div>
        <div class="row-right">
          ${delayHtml}
          ${j.platform ? `<div class="platform">Gleis ${j.platform}</div>` : ""}
        </div>
      `;
      el.list.appendChild(row);
    }
  }

  // ---------- Hauptablauf ----------

  function currentPair() {
    return direction === "sb-dl"
      ? { from: STATIONS.sb, to: STATIONS.dl }
      : { from: STATIONS.dl, to: STATIONS.sb };
  }

  let geoPending = false;   // Standort wird gerade bestimmt
  let geoMs = null;         // Dauer der letzten Standortbestimmung
  let manualAt = 0;         // Zeitpunkt der letzten manuellen Richtungswahl
  let shown = null;         // aktuell angezeigte Daten (für die Statuszeile)

  function updateHeader() {
    const { from, to } = currentPair();
    el.fromName.textContent = from.label;
    el.toName.textContent = to.label;
    el.autoBadge.classList.toggle("off", geoPending || !autoMode);
    el.autoBadgeText.textContent = geoPending ? "Standort …" : (autoMode ? "Standort" : "manuell");
  }

  function fmtSecs(ms) { return (ms / 1000).toFixed(1).replace(".", ",") + "s"; }

  function refreshStatus() {
    if (!shown) return;
    const t = shown.timing || {};
    const parts = ["Stand " + new Date(shown.at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })];
    if (typeof t.dep === "number") parts.push("Ab " + fmtSecs(t.dep));
    if (typeof t.arr === "number") parts.push("An " + fmtSecs(t.arr));
    if (geoMs !== null) parts.push("Ort " + fmtSecs(geoMs));
    el.statusText.textContent = parts.join(" · ");
  }

  function showData(d) {
    renderJourneys(d.journeys, false);
    shown = d;
    refreshStatus();
  }

  let loadSeq = 0;
  // force=true: immer neu abrufen. force=false: frische Daten aus dem Zwischenspeicher nutzen.
  async function load(force) {
    const mySeq = ++loadSeq;
    const dir = direction;
    updateHeader();
    if (force === false && isFresh(dir)) {   // sofortige Anzeige, kein Abruf nötig
      showData(dirData[dir]);
      return;
    }
    el.statusText.textContent = "";
    shown = null;
    renderLoading();
    try {
      const d = await fetchDir(dir, force !== false, partial => {
        if (mySeq === loadSeq) renderJourneys(partial, true);   // Abfahrten sofort, Ankünfte folgen
      });
      if (mySeq !== loadSeq) return;
      showData(d);
    } catch (err) {
      if (mySeq !== loadSeq) return;
      renderError(err.message || "Unbekannter Fehler.", () => load(true));
      el.statusText.textContent = "Fehler";
      console.error(err);
    }
  }

  function otherDir(dir) { return dir === "sb-dl" ? "dl-sb" : "sb-dl"; }

  function setDirection(dir, isAuto) {
    direction = dir;
    autoMode = !!isAuto;
    if (!isAuto) manualAt = Date.now();
    localStorage.setItem("direction", direction);
    load(false);
  }

  // ---------- Geolocation ----------

  // Bestimmt die Richtung per Standort. Die Daten werden NICHT darauf gewartet, sondern
  // schon vorher geladen. Ergibt der Standort eine andere Richtung, wird sofort umgeschaltet
  // (die Gegenrichtung ist dann meist schon vorgeladen).
  function locate() {
    const startedAt = Date.now();
    const tg = performance.now();
    geoPending = true;
    geoMs = null;
    el.locateBtn.textContent = "📍 …";
    updateHeader();

    const finish = () => {
      geoPending = false;
      el.locateBtn.textContent = "📍 Standort";
    };

    if (!("geolocation" in navigator)) {
      finish();
      autoMode = false;
      updateHeader();
      return;
    }

    navigator.geolocation.getCurrentPosition(
      pos => {
        geoMs = performance.now() - tg;
        finish();
        if (manualAt > startedAt) {          // in der Zwischenzeit manuell gewählt: respektieren
          updateHeader();
          refreshStatus();
          return;
        }
        const { latitude, longitude } = pos.coords;
        const dSb = haversine(latitude, longitude, STATIONS.sb.lat, STATIONS.sb.lon);
        const dDl = haversine(latitude, longitude, STATIONS.dl.lat, STATIONS.dl.lon);
        const dir = dSb <= dDl ? "sb-dl" : "dl-sb";
        const changed = dir !== direction;
        direction = dir;
        autoMode = true;
        localStorage.setItem("direction", direction);
        if (changed) load(false);
        else { updateHeader(); refreshStatus(); }
      },
      err => {
        finish();
        autoMode = false;
        updateHeader();
        console.warn("Geolocation nicht verfügbar:", err.message);
      },
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
    );
  }

  // Beim Öffnen: sofort laden, Gegenrichtung im Hintergrund vorladen, Standort parallel bestimmen.
  let lastStartAt = 0;
  function start() {
    lastStartAt = Date.now();
    load(true);
    fetchDir(otherDir(direction), true).catch(() => {});
    locate();
  }

  // ---------- Events ----------

  el.swapBtn.addEventListener("click", () => {
    setDirection(otherDir(direction), false);
  });

  el.locateBtn.addEventListener("click", locate);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - lastStartAt > 3000) {
      start();
    }
  });

  // ---------- Manifest (für "Zum Home-Bildschirm hinzufügen") ----------

  try {
    const icon = "data:image/svg+xml," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='#0a0d12'/><text x='50' y='66' font-size='58' text-anchor='middle' fill='#ffb020' font-family='monospace'>⇄</text></svg>`
    );
    const manifest = {
      name: "Zugverbindungen Saarbrücken ⇄ Dillingen",
      short_name: "SB ⇄ DL",
      start_url: ".",
      display: "standalone",
      background_color: "#0a0d12",
      theme_color: "#0a0d12",
      icons: [{ src: icon, sizes: "192x192 512x512", type: "image/svg+xml" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    document.getElementById("manifestLink").href = URL.createObjectURL(blob);
  } catch (e) { /* nicht kritisch */ }

  // ---------- Start ----------

  updateHeader();
  start();

})();
</script>
</body>
</html>
