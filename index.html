<style>
  :root {
    --bg: #0a0d12;
    --panel: #11151d;
    --panel-2: #171c26;
    --line: #232a37;
    --amber: #ffb020;
    --amber-dim: #8a6a2c;
    --text: #e8e6df;
    --text-dim: #8791a1;
    --red: #ff5a5a;
    --green: #4ad9a0;
    --radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  }

  /* Header */
  header { margin-bottom: 14px; }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    margin: 0;
  }
  .clock {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 15px;
    color: var(--amber-dim);
    font-variant-numeric: tabular-nums;
  }

  /* Route display, split-flap style */
  .route {
    margin-top: 14px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
  }
  .route::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }
  .route-stations {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .route-station {
    font-size: 21px;
    font-weight: 600;
    color: var(--amber);
    letter-spacing: 0.01em;
    flex: 1;
    min-width: 0;
  }
  .route-station.from { text-align: left; }
  .route-station.to { text-align: right; }
  .route-arrow {
    color: var(--amber-dim);
    font-size: 18px;
    flex-shrink: 0;
  }
  .route-meta {
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
  }
  .badge-auto {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(74, 217, 160, 0.12);
    color: var(--green);
    font-size: 11px;
    font-weight: 600;
  }
  .badge-auto.off { background: rgba(135,145,161,0.12); color: var(--text-dim); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Controls */
  .controls {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  button {
    font-family: inherit;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: var(--panel-2); }
  .btn-swap { flex-shrink: 0; }
  .btn-locate { flex: 1; color: var(--text-dim); }
  .btn-locate.active { color: var(--green); border-color: rgba(74,217,160,0.3); }

  /* List */
  .list {
    margin-top: 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .section-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 4px 2px 2px;
  }
  .row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .row-time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 19px;
    font-weight: 600;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .row-time .planned {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: line-through;
    font-weight: 400;
    margin-top: 1px;
  }
  .row-mid { min-width: 0; }
  .row-line {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.past .row-time { color: var(--text-dim); }
  .row.past .row-sub { color: var(--text); font-weight: 600; }
  .row.past .row-sub.late { color: var(--red); }
  .row-sub.late { color: var(--red); }
  .row-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .delay {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    font-weight: 700;
  }
  .delay.on-time { color: var(--green); }
  .delay.late { color: var(--red); }
  .delay.cancelled {
    background: var(--red);
    color: #1a0505;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 11px;
  }
  .platform {
    font-size: 11px;
    color: var(--text-dim);
  }

  .empty, .error, .loading {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .error { color: var(--red); }
  .error button { margin-top: 12px; }
  .skeleton {
    height: 58px;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 37%, var(--panel) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  footer {
    margin-top: 16px;
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
  }
  footer a { color: var(--text-dim); }

  @media (prefers-reduced-motion: reduce) {
    .skeleton { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row" style="justify-content:flex-end;">
      <div class="clock" id="clock">--:--</div>
    </div>
  </header>

  <div class="route">
    <div class="route-stations">
      <div class="route-station from" id="fromName">Saarbrücken Hbf</div>
      <div class="route-arrow">→</div>
      <div class="route-station to" id="toName">Dillingen (Saar)</div>
    </div>
    <div class="route-meta">
      <span id="statusText"></span>
      <span class="badge-auto" id="autoBadge"><span class="dot"></span><span id="autoBadgeText">Standort</span></span>
    </div>
  </div>

  <div class="controls">
    <button class="btn-locate" id="locateBtn">📍 Standort</button>
    <button class="btn-swap" id="swapBtn">⇄ Richtung</button>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
(function () {
  "use strict";

  // Eigener Cloudflare-Worker-Proxy (leitet Anfragen an bahn.de weiter)
  const PROXY_BASE = "https://db-proxy.daniel-goergen.workers.dev";

  // Fallback-Endpunkte (Community-Spiegel), falls der Proxy nicht erreichbar ist.
  const API_BASES = [
    "https://db.emmabyte.de",
    "https://v6.db.transport.rest"
  ];
  const WINDOW_MIN = 120;      // Zeitfenster in Minuten
  const PAST_MIN = 30;         // wie weit zurück (bereits abgefahrene Züge, die noch unterwegs sind)

  // Referenzkoordinaten zum eindeutigen Auflösen der Stationen
  // (verhindert Verwechslung z.B. mit "Dillingen (Donau)")
  const STATIONS = {
    sb: { key: "sb", label: "Saarbrücken Hbf",  query: "Saarbrücken Hbf",   lat: 49.2414,  lon: 6.9906,  id: null, bahnde: null },
    dl: { key: "dl", label: "Dillingen (Saar)",  query: "Dillingen (Saar)", lat: 49.35263, lon: 6.72258, id: null, bahnde: null }
  };

  let direction = localStorage.getItem("direction") || "sb-dl"; // "sb-dl" oder "dl-sb"
  let autoMode = true;

  const el = {
    fromName: document.getElementById("fromName"),
    toName: document.getElementById("toName"),
    statusText: document.getElementById("statusText"),
    list: document.getElementById("list"),
    swapBtn: document.getElementById("swapBtn"),
    locateBtn: document.getElementById("locateBtn"),
    autoBadge: document.getElementById("autoBadge"),
    autoBadgeText: document.getElementById("autoBadgeText"),
    clock: document.getElementById("clock")
  };

  // ---------- Hilfsfunktionen ----------

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  }

  function updateClock() {
    el.clock.textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- Stationen auflösen (einmalig, dann Cache) ----------

  // Fetch mit Timeout, der mehrere API-Basen durchprobiert und sich die
  // funktionierende merkt (falls die primäre Quelle down ist).
  async function fetchOnce(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal, mode: "cors", cache: "no-store" });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.text()).slice(0, 200); } catch (e) {}
        throw new Error("API-Fehler " + res.status + " " + res.statusText + (detail ? " – " + detail : ""));
      }
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchJson(path) {
    const preferred = localStorage.getItem("apiBase");
    const bases = preferred ? [preferred, ...API_BASES.filter(b => b !== preferred)] : API_BASES;
    const errors = [];
    for (const base of bases) {
      try {
        const data = await fetchOnce(base + path, 7000);
        localStorage.setItem("apiBase", base);
        return data;
      } catch (err) {
        const reason = err.name === "AbortError" ? "Zeitüberschreitung (7s)" : (err.name + ": " + err.message);
        errors.push(base + " → " + reason);
      }
    }
    throw new Error(
      "Keine der Datenquellen war erreichbar. Mögliche Ursachen: keine Internetverbindung, " +
      "ein Inhalte-/Werbeblocker blockiert die Domain, oder die APIs sind gerade down.\n" +
      errors.join("\n")
    );
  }

  async function resolveStation(station) {
    const cached = localStorage.getItem("stationId:" + station.key);
    if (cached) {
      station.id = cached;
      return;
    }
    const path = `/locations?query=${encodeURIComponent(station.query)}&results=6&poi=false&addresses=false`;
    const results = await fetchJson(path);
    const stops = results.filter(r => r.type === "stop" && r.location);
    if (!stops.length) throw new Error("Station nicht gefunden: " + station.label);
    // Nächstgelegenen Treffer zur Referenzkoordinate wählen (löst Namensdopplungen auf)
    let best = stops[0];
    let bestDist = Infinity;
    for (const s of stops) {
      const d = haversine(station.lat, station.lon, s.location.latitude, s.location.longitude);
      if (d < bestDist) { bestDist = d; best = s; }
    }
    station.id = best.id;
    localStorage.setItem("stationId:" + station.key, best.id);
  }

  // ---------- Hilfsfunktionen für bahn.de ----------

  function getProxyBase() {
    return PROXY_BASE;
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function localDatum(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function localZeit(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }

  // ---------- bahn.de über eigenen Proxy (primäre Quelle, falls konfiguriert) ----------

  async function resolveStationBahnDe(proxyBase, station) {
    const cacheKey = "bahndeId:" + station.key;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      station.bahnde = JSON.parse(cached);
      return;
    }
    const path = `/web/api/reiseloesung/orte?suchbegriff=${encodeURIComponent(station.query)}&typ=ALL&limit=6`;
    const data = await fetchOnce(proxyBase + path, 8000);
    const arr = Array.isArray(data) ? data : (data.orte || data.results || Object.values(data).find(v => Array.isArray(v)) || []);
    if (!arr || !arr.length) throw new Error("bahn.de (Proxy): Station nicht gefunden – " + station.label);

    let best = null, bestDist = Infinity;
    for (const s of arr) {
      const lat = s.lat ?? s.latitude ?? (s.coordinates && s.coordinates.lat);
      const lon = s.lon ?? s.lng ?? s.longitude ?? (s.coordinates && s.coordinates.lng);
      if (lat == null || lon == null) continue;
      const d = haversine(station.lat, station.lon, lat, lon);
      if (d < bestDist) { bestDist = d; best = s; }
    }
    if (!best) best = arr[0];

    const extId = best.extId || best.evaNr || best.ortExtId;
    const ortId = best.id || best.ortId;
    if (!extId || !ortId) {
      throw new Error("bahn.de (Proxy): Unerwartetes Antwortformat bei der Stationssuche.\n" + JSON.stringify(best).slice(0, 300));
    }
    station.bahnde = { extId: String(extId), ortId: String(ortId), name: best.name || station.label };
    localStorage.setItem(cacheKey, JSON.stringify(station.bahnde));
  }

  async function fetchBoardBatch(proxyBase, board, station, when) {
    const path = `/web/api/reiseloesung/${board}?datum=${localDatum(when)}&zeit=${encodeURIComponent(localZeit(when))}` +
      `&ortExtId=${encodeURIComponent(station.bahnde.extId)}&ortId=${encodeURIComponent(station.bahnde.ortId)}` +
      `&mitVias=true&maxVias=40`;
    const data = await fetchOnce(proxyBase + path, 8000);
    const arr = Array.isArray(data) ? data : (data.entries || data.abfahrten || data.ankuenfte || Object.values(data).find(v => Array.isArray(v)) || null);
    if (!Array.isArray(arr)) {
      throw new Error("bahn.de (Proxy): Unerwartetes Antwortformat (" + board + ").\n" + JSON.stringify(data).slice(0, 300));
    }
    return arr;
  }

  // Der Endpunkt liefert pro Aufruf nur eine begrenzte Anzahl an Einträgen über
  // ALLE Richtungen hinweg. Deshalb wird die Startzeit schrittweise vorgeschoben,
  // bis das gewünschte Zeitfenster abgedeckt ist.
  async function collectBoard(proxyBase, board, station, start, end, maxIter) {
    const seen = new Map();
    let cursor = start;
    for (let i = 0; i < maxIter; i++) {
      const batch = await fetchBoardBatch(proxyBase, board, station, cursor);
      if (!batch.length) break;

      let lastTime = null;
      for (const item of batch) {
        const key = item.journeyId || ((item.zeit || "") + "|" + (item.verkehrmittel && item.verkehrmittel.name));
        if (!seen.has(key)) seen.set(key, item);
        const t = new Date(item.ezZeit || item.zeit);
        if (!isNaN(t.getTime()) && (!lastTime || t > lastTime)) lastTime = t;
      }
      if (!lastTime || lastTime >= end) break;
      cursor = new Date(lastTime.getTime() + 60000);
    }
    return seen;
  }

  function trainKey(item) {
    const vm = item.verkehrmittel || item.verkehrsmittel || {};
    return (vm.name || "") + "|" + (vm.linienNummer || "");
  }

  async function fetchJourneysViaProxy(proxyBase, fromStation, toStation) {
    await Promise.all([
      resolveStationBahnDe(proxyBase, fromStation),
      resolveStationBahnDe(proxyBase, toStation)
    ]);

    const now = new Date();
    const windowEnd = new Date(now.getTime() + WINDOW_MIN * 60000);
    const windowStart = new Date(now.getTime() - PAST_MIN * 60000);

    // Abfahrten am Start und Ankünfte am Ziel parallel holen.
    // Ein Fehler bei den Ankünften darf die Liste nicht verhindern.
    const [seen, arrivals] = await Promise.all([
      collectBoard(proxyBase, "abfahrten", fromStation, windowStart, windowEnd, 15),
      collectBoard(proxyBase, "ankuenfte", toStation, windowStart, new Date(windowEnd.getTime() + 60 * 60000), 15)
        .catch(err => { console.warn("Ankunftstafel nicht verfügbar:", err); return new Map(); })
    ]);

    // Ankünfte nach Zugnummer gruppieren
    const arrivalsByTrain = new Map();
    for (const a of arrivals.values()) {
      const k = trainKey(a);
      if (!arrivalsByTrain.has(k)) arrivalsByTrain.set(k, []);
      arrivalsByTrain.get(k).push(a);
    }

    // Passende Ankunft zu einer Abfahrt: gleiche Zugnummer, planmäßige Ankunft
    // nach der planmäßigen Abfahrt (frühester Treffer).
    function findArrival(depItem, plannedDeparture) {
      const list = arrivalsByTrain.get(trainKey(depItem));
      if (!list) return null;
      let best = null, bestT = Infinity;
      for (const a of list) {
        const planned = new Date(a.zeit);
        if (isNaN(planned.getTime())) continue;
        const diff = planned - plannedDeparture;
        if (diff >= -60000 && diff < 6 * 3600000 && diff < bestT) { bestT = diff; best = a; }
      }
      if (!best) return null;
      const plannedArr = new Date(best.zeit);
      const realArr = new Date(best.ezZeit || best.zeit);
      return {
        arrival: isNaN(realArr.getTime()) ? plannedArr : realArr,
        arrivalDelaySec: isNaN(realArr.getTime()) ? null : Math.round((realArr - plannedArr) / 1000)
      };
    }

    const targetNames = [
      toStation.bahnde.name,
      toStation.label,
      toStation.label.replace(" (", "("),
      toStation.label.replace(" (Saar)", "")
    ].filter(Boolean);

    const mapped = Array.from(seen.values())
      .map(item => {
        const raw = JSON.stringify(item);
        if (!targetNames.some(n => raw.includes(n))) return null;

        const plannedRaw = item.zeit || item.plannedWhen || item.abfahrtszeit || item.planned;
        const realRaw = item.ezZeit || item.ezAbfahrtszeit || item.realZeit || item.when || plannedRaw;
        if (!plannedRaw) return null;
        const plannedDeparture = new Date(plannedRaw);
        const departure = new Date(realRaw || plannedRaw);
        if (isNaN(departure.getTime())) return null;

        let delaySec = null;
        if (typeof item.verspaetung === "number") {
          delaySec = item.verspaetung * 60;
        } else if (!isNaN(plannedDeparture.getTime()) && !isNaN(departure.getTime())) {
          delaySec = Math.round((departure - plannedDeparture) / 1000);
        }

        const vm = item.verkehrmittel || item.verkehrsmittel || {};
        const lineName = vm.mittelText || vm.linienNummer || vm.langText || vm.kurzText || item.linienbezeichnung || item.zugnummer || "?";
        const platform = item.gleis || item.ezGleis || item.plattform || item.ezPlattform || null;
        const cancelled = !!(item.cancelled || item.ausfall || item.canceled || item.storniert);
        const arr = findArrival(item, isNaN(plannedDeparture.getTime()) ? departure : plannedDeparture);

        return {
          departure,
          plannedDeparture: isNaN(plannedDeparture.getTime()) ? departure : plannedDeparture,
          departureDelay: delaySec,
          platform,
          cancelled,
          lineName,
          arrival: arr ? arr.arrival : null,
          arrivalDelaySec: arr ? arr.arrivalDelaySec : null,
          transfers: 0
        };
      })
      .filter(Boolean);

    const result = mapped
      .filter(j => j.departure >= windowStart && j.departure <= windowEnd)
      // bereits abgefahrene Züge nur, solange sie noch nicht am Ziel angekommen sind
      .filter(j => !(j.arrival && j.arrival < new Date(now.getTime() - 60000)))
      .sort((a, b) => a.departure - b.departure);
    return result;
  }

  // ---------- Verbindungen laden ----------

  async function fetchJourneys(fromStation, toStation) {
    const proxyBase = getProxyBase();
    if (proxyBase) {
      try {
        return await fetchJourneysViaProxy(proxyBase, fromStation, toStation);
      } catch (err) {
        console.warn("Proxy-Route (bahn.de) fehlgeschlagen, Fallback auf Community-APIs:", err);
      }
    }
    await Promise.all([resolveStation(fromStation), resolveStation(toStation)]);
    return fetchJourneysFallback(fromStation, toStation);
  }

  async function fetchJourneysFallback(fromStation, toStation) {
    const now = new Date();
    const path = `/journeys?from=${fromStation.id}&to=${toStation.id}` +
      `&departure=${encodeURIComponent(now.toISOString())}&results=8&stopovers=false`;
    const data = await fetchJson(path);
    const journeys = data.journeys || [];

    const windowEnd = new Date(now.getTime() + WINDOW_MIN * 60000);

    return journeys
      .map(j => {
        const legs = (j.legs || []).filter(l => !l.walking);
        if (!legs.length) return null;
        const first = legs[0];
        const last = legs[legs.length - 1];
        const dep = first.departure || first.plannedDeparture;
        if (!dep) return null;
        return {
          departure: new Date(dep),
          plannedDeparture: new Date(first.plannedDeparture || dep),
          departureDelay: first.departureDelay,
          platform: first.departurePlatform || first.plannedDeparturePlatform,
          cancelled: !!(first.cancelled || last.cancelled),
          lineName: legs.map(l => (l.line && l.line.name) || "?").join(" → "),
          arrival: new Date(last.arrival || last.plannedArrival),
          transfers: legs.length - 1
        };
      })
      .filter(j => j && j.departure >= new Date(now.getTime() - 60000) && j.departure <= windowEnd)
      .sort((a, b) => a.departure - b.departure);
  }

  // ---------- Rendering ----------

  function renderLoading() {
    el.list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  }

  function renderError(msg, retryFn) {
    el.list.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "error";
    const msgEl = document.createElement("div");
    msgEl.style.whiteSpace = "pre-line";
    msgEl.style.textAlign = "left";
    msgEl.textContent = msg;
    wrap.appendChild(msgEl);
    const btn = document.createElement("button");
    btn.textContent = "Erneut versuchen";
    btn.style.marginTop = "12px";
    btn.onclick = retryFn;
    wrap.appendChild(btn);
    el.list.appendChild(wrap);
  }

  function renderJourneys(journeys) {
    el.list.innerHTML = "";
    if (!journeys.length) {
      el.list.innerHTML = `<div class="empty">Keine Verbindungen.</div>`;
      return;
    }
    for (const j of journeys) {
      const row = document.createElement("div");
      row.className = "row" + (j.departure < new Date() ? " past" : "");

      const delayMin = typeof j.departureDelay === "number" ? Math.round(j.departureDelay / 60) : null;
      const showPlanned = delayMin && delayMin !== 0;

      let delayHtml;
      if (j.cancelled) {
        delayHtml = `<span class="delay cancelled">Ausfall</span>`;
      } else if (delayMin === null) {
        delayHtml = `<span class="delay on-time">planm.</span>`;
      } else if (delayMin <= 0) {
        delayHtml = `<span class="delay on-time">pünktlich</span>`;
      } else {
        delayHtml = `<span class="delay late">+${delayMin} min</span>`;
      }

      const arrLate = typeof j.arrivalDelaySec === "number" && j.arrivalDelaySec >= 60;
      const subText = (j.arrival ? "an " + fmtTime(j.arrival) : "") +
        (j.transfers > 0 ? (j.arrival ? " · " : "") + j.transfers + "x umsteigen" : "");

      row.innerHTML = `
        <div class="row-time">
          ${fmtTime(j.departure)}
          ${showPlanned ? `<span class="planned">${fmtTime(j.plannedDeparture)}</span>` : ""}
        </div>
        <div class="row-mid">
          <div class="row-line">${j.lineName}</div>
          ${subText ? `<div class="row-sub${arrLate ? " late" : ""}">${subText}</div>` : ""}
        </div>
        <div class="row-right">
          ${delayHtml}
          ${j.platform ? `<div class="platform">Gleis ${j.platform}</div>` : ""}
        </div>
      `;
      el.list.appendChild(row);
    }
  }

  // ---------- Hauptablauf ----------

  function currentPair() {
    return direction === "sb-dl"
      ? { from: STATIONS.sb, to: STATIONS.dl }
      : { from: STATIONS.dl, to: STATIONS.sb };
  }

  function updateHeader() {
    const { from, to } = currentPair();
    el.fromName.textContent = from.label;
    el.toName.textContent = to.label;
    el.autoBadge.classList.toggle("off", !autoMode);
    el.autoBadgeText.textContent = autoMode ? "Standort" : "manuell";
  }

  async function load() {
    updateHeader();
    el.statusText.textContent = "";
    renderLoading();
    try {
      const { from, to } = currentPair();
      const journeys = await fetchJourneys(from, to);
      renderJourneys(journeys);
      el.statusText.textContent = "Stand " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    } catch (err) {
      renderError(err.message || "Unbekannter Fehler.", load);
      el.statusText.textContent = "Fehler";
      console.error(err);
    }
  }

  function setDirection(dir, isAuto) {
    direction = dir;
    autoMode = !!isAuto;
    localStorage.setItem("direction", direction);
    load();
  }

  // ---------- Geolocation ----------

  function tryGeolocate() {
    if (!("geolocation" in navigator)) {
      autoMode = false;
      updateHeader();
      return;
    }
    el.locateBtn.textContent = "📍 …";
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        const dSb = haversine(latitude, longitude, STATIONS.sb.lat, STATIONS.sb.lon);
        const dDl = haversine(latitude, longitude, STATIONS.dl.lat, STATIONS.dl.lon);
        const dir = dSb <= dDl ? "sb-dl" : "dl-sb";
        el.locateBtn.textContent = "📍 Standort";
        setDirection(dir, true);
      },
      err => {
        el.locateBtn.textContent = "📍 Standort";
        autoMode = false;
        updateHeader();
        console.warn("Geolocation nicht verfügbar:", err.message);
      },
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 }
    );
  }

  // ---------- Events ----------

  el.swapBtn.addEventListener("click", () => {
    setDirection(direction === "sb-dl" ? "dl-sb" : "sb-dl", false);
  });

  el.locateBtn.addEventListener("click", tryGeolocate);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      load();
    }
  });

  // ---------- Manifest (für "Zum Home-Bildschirm hinzufügen") ----------

  try {
    const icon = "data:image/svg+xml," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='#0a0d12'/><text x='50' y='66' font-size='58' text-anchor='middle' fill='#ffb020' font-family='monospace'>⇄</text></svg>`
    );
    const manifest = {
      name: "Zugverbindungen Saarbrücken ⇄ Dillingen",
      short_name: "SB ⇄ DL",
      start_url: ".",
      display: "standalone",
      background_color: "#0a0d12",
      theme_color: "#0a0d12",
      icons: [{ src: icon, sizes: "192x192 512x512", type: "image/svg+xml" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    document.getElementById("manifestLink").href = URL.createObjectURL(blob);
  } catch (e) { /* nicht kritisch */ }

  // ---------- Start ----------

  updateHeader();
  tryGeolocate();   // versucht Standort zu ermitteln, lädt danach automatisch
  load();           // sofort mit letzter bekannter/Default-Richtung laden, wird ggf. durch Geolocation überschrieben

})();
</script>
</body>
</html>
